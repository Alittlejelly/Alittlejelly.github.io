<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>果冻设计 - 后台管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'MiSans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f5f5f5; min-height: 100vh; display: flex; }
        /* 登录页 */
        .login-screen {
            position: fixed; z-index: 999; inset: 0; background: #f5f5f5;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 24px;
        }
        .login-screen.hidden { display: none; }
        .login-box {
            background: #fff; border-radius: 20px; padding: 36px 32px 32px;
            max-width: 340px; width: 100%; text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }
        .login-box h2 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .login-box p { font-size: 13px; color: #999; margin-bottom: 24px; }
        .login-box input {
            width: 100%; padding: 10px 14px; border: 1px solid #eee; border-radius: 12px;
            font-size: 15px; color: #333; outline: none; text-align: center;
            transition: border-color 0.2s; margin-bottom: 14px;
        }
        .login-box input:focus { border-color: #1a1a2e; }
        .login-box button {
            width: 100%; padding: 10px 0; border: none; border-radius: 12px;
            background: #1a1a2e; color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.25s;
        }
        .login-box button:hover { background: #2c2c4a; }
        .login-box .error { font-size: 12px; color: #dc2626; margin-bottom: 10px; min-height: 18px; }

        /* 侧边栏 */
        .sidebar {
            width: 220px; min-height: 100vh; background: #fff;
            border-right: 1px solid #eee; padding: 24px 16px;
            display: flex; flex-direction: column; position: fixed; left: 0; top: 0; z-index: 10;
        }
        .sidebar .nav-item:first-child { margin-top: 0; }
        .sidebar .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
            font-size: 14px; font-weight: 500; color: #666; cursor: pointer; transition: all 0.2s;
            border: none; background: none; text-align: left; width: 100%; margin-bottom: 2px;
        }
        .sidebar .nav-item:hover { background: #f0f0f0; color: #333; }
        .sidebar .nav-item.active { background: #1a1a2e; color: #fff; }
        .sidebar .back-link {
            margin-top: auto; display: flex; align-items: center; gap: 8px;
            padding: 10px 12px; border-radius: 10px; font-size: 13px; color: #999;
            text-decoration: none; transition: all 0.2s;
        }
        .sidebar .back-link:hover { background: #f0f0f0; color: #666; }

        /* 主内容 */
        .main-content { margin-left: 220px; flex: 1; padding: 32px 32px 32px 20px; min-height: 100vh; }

        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .topbar h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; }


        /* 提示 */
        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 999;
            background: #1a1a2e; color: #fff; padding: 12px 24px; border-radius: 12px;
            font-size: 14px; opacity: 0; transform: translateY(-12px);
            transition: all 0.35s cubic-bezier(0.23,1,0.32,1); pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* 每个分类面板 */
        .panel { display: none; }
        .panel.active { display: block; }

        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .panel-header h3 { font-size: 16px; font-weight: 600; color: #1a1a2e; }
        .panel-header .add-btn {
            padding: 6px 16px; border: none; border-radius: 8px; background: #f0f0f0; color: #333;
            font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .panel-header .add-btn:hover { background: #1a1a2e; color: #fff; }
        .panel-header .back-site-btn { font-weight: 500 ;display: none; }

        /* 管理卡片网格 */
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }

        .manage-card {
            background: #fff; border-radius: 14px; border: 1px solid #eee; overflow: hidden;
            display: flex; align-items: stretch; transition: all 0.25s;
        }
        .manage-card:hover { border-color: #ddd; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }

        .manage-card .preview {
            width: 100px; min-height: 100px; flex-shrink: 0;
            background-size: cover; background-position: center; background-color: #f5f5f5;
        }
        .manage-card .preview.wide { width: 120px; }

        .manage-card .info {
            flex: 1; padding: 14px 16px; display: flex; flex-direction: column; justify-content: center;
        }
        .manage-card .info .name {
            font-size: 15px; font-weight: 600; color: #1a1a2e; margin-bottom: 4px;
        }
        .manage-card .info .id-text {
            font-size: 12px; color: #bbb; margin-bottom: 8px;
        }
        .manage-card .info .links {
            display: flex; flex-wrap: wrap; gap: 4px;
        }
        .manage-card .info .links .tag {
            font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #f5f5f5; color: #999;
        }
        .manage-card .info .links .tag.has-link { background: #eef2ff; color: #667eea; }

        .manage-card .actions {
            display: flex; flex-direction: column; justify-content: center; gap: 4px;
            padding: 14px 12px 14px 0;
        }
        .manage-card .actions button {
            padding: 4px 12px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer;
            transition: all 0.2s; background: #f5f5f5; color: #666;
        }
        .manage-card .actions button:hover { background: #e8e8e8; }
        .manage-card .actions .delete-btn:hover { background: #fee2e2; color: #dc2626; }

        /* 弹窗 */
        .modal {
            position: fixed; z-index: 200; inset: 0; display: flex; align-items: center; justify-content: center;
            padding: 20px; background: rgba(0,0,0,0.15); backdrop-filter: blur(6px);
            opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
        }
        .modal.show { opacity: 1; visibility: visible; }

        .modal-box {
            background: #fff; border-radius: 20px; padding: 28px 24px 24px;
            max-width: 440px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            transform: scale(0.92) translateY(12px); transition: transform 0.3s cubic-bezier(0.23,1,0.32,1);
        }
        .modal.show .modal-box { transform: scale(1) translateY(0); }

        .modal-box h3 { font-size: 18px; font-weight: 700; color: #1a1a2e; margin-bottom: 20px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #666; margin-bottom: 4px; }
        .form-group input, .form-group select {
            width: 100%; padding: 8px 12px; border: 1px solid #eee; border-radius: 10px;
            font-size: 14px; color: #333; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #1a1a2e; }
        .form-group .helper { font-size: 11px; color: #bbb; margin-top: 2px; }

        /* 缩略图上传 */
        .thumb-row { display: flex; gap: 12px; align-items: center; }
        .thumb-preview {
            width: 84px; height: 84px; flex-shrink: 0; border-radius: 12px;
            border: 1px dashed #e2e2e2; background: #fafafa center/cover no-repeat;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #ccc; overflow: hidden;
        }
        .thumb-side { flex: 1; min-width: 0; }
        .upload-btn {
            padding: 7px 16px; border: none; border-radius: 10px; background: #1a1a2e; color: #fff;
            font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .upload-btn:hover { background: #2c2c4a; }
        .upload-btn:disabled { background: #ccc; cursor: default; }

        /* 自定义链接行 */
        .link-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        .form-group .link-row input.link-label { flex: 0 0 96px; }
        .form-group .link-row input.link-url { flex: 1 1 auto; min-width: 0; }
        .form-group .link-row input.link-pwd { flex: 0 0 88px; }
        .link-row .del-link {
            flex-shrink: 0; width: 32px; height: 32px; border: none; border-radius: 9px;
            background: #f5f5f5; color: #999; font-size: 16px; line-height: 1; cursor: pointer;
            transition: all 0.2s;
        }
        .link-row .del-link:hover { background: #fee2e2; color: #dc2626; }
        .add-link-btn {
            padding: 6px 14px; border: 1px dashed #ddd; border-radius: 9px; background: #fafafa;
            color: #666; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .add-link-btn:hover { background: #f0f0f0; color: #1a1a2e; border-color: #ccc; }

        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .modal-actions button {
            padding: 8px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
        }
        .modal-actions .cancel-btn { background: #f5f5f5; color: #666; }
        .modal-actions .cancel-btn:hover { background: #e8e8e8; }
        .modal-actions .confirm-btn { background: #1a1a2e; color: #fff; }
        .modal-actions .confirm-btn:hover { background: #2c2c4a; }



        @media (max-width: 860px) {
            .sidebar { width: 200px; padding: 20px 12px; }
            .main-content { margin-left: 200px; padding: 24px 16px 24px 12px; }
        }

        @media (max-width: 640px) {
            .mobile-nav {
                display: flex !important;
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 60;
                flex-direction: row;
                padding: 4px;
                gap: 0;
                background: rgba(255,255,255,0.65);
                backdrop-filter: blur(24px) saturate(180%);
                -webkit-backdrop-filter: blur(24px) saturate(180%);
                border: 1px solid rgba(0,0,0,0.06);
                border-radius: 999px;
                box-shadow: 0 4px 24px rgba(0,0,0,0.08);
                width: auto;
                min-width: 280px;
            }
            .mobile-nav .nav-item {
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                padding: 10px 0;
                flex: 1;
                border-radius: 999px;
                border: none;
                background: transparent;
                color: #666;
                font-weight: 500;
                cursor: pointer;
                position: relative;
                z-index: 1;
                transition: all 0.2s;
            }
            .mobile-nav .nav-item.active { color: #fff; background: transparent; }
            .mobile-nav .nav-slider {
                position: absolute;
                top: 4px;
                bottom: 4px;
                border-radius: 999px;
                background: #1a1a2e;
                z-index: 0;
                transition: left 0.3s cubic-bezier(0.23,1,0.32,1), width 0.3s cubic-bezier(0.23,1,0.32,1);
            }

            body { flex-direction: column; }
            .sidebar { display: none; }

            .main-content {
                margin-left: 0;
                padding: 16px 14px 80px;
            }

            .topbar {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 16px;
            }
            .topbar h1 { font-size: 18px; }
            .topbar .save-btn {
                padding: 6px 16px;
                font-size: 13px;
                white-space: nowrap;
            }

            .panel-header {
                margin-bottom: 14px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .panel-header h3 { font-size: 14px; margin: 0; }
            .panel-header .header-actions {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .panel-header .add-btn {
                padding: 4px 12px;
                font-size: 12px;
                border-radius: 8px;
            }
            .panel-header .back-site-btn {
                padding: 4px 10px;
                font-size: 12px;
                border-radius: 8px;
                background: #f0f0f0;
                color: #1a1a2e;
                text-decoration: none;
                transition: all 0.2s;
                display: inline-flex;
                align-items: center;
                gap: 3px;
            }
            .panel-header .back-site-btn:hover { background: #e0e0e0; color: #333; }

            .item-grid {
                grid-template-columns: 1fr !important;
                gap: 12px;
            }
            .manage-card { border-radius: 12px; }
            .manage-card .preview { width: 80px; min-height: 80px; }
            .manage-card .preview.wide { width: 80px; }
            .manage-card .info { padding: 10px 12px; }
            .manage-card .info .name { font-size: 14px; }
            .manage-card .info .id-text { font-size: 11px; }
            .manage-card .actions { padding: 10px 8px 10px 0; }
            .manage-card .actions button { padding: 3px 10px; font-size: 11px; }

            .modal-box { padding: 24px 20px; max-width: 340px; }
            .modal-box h3 { font-size: 16px; margin-bottom: 16px; }
            .form-group { margin-bottom: 10px; }
            .form-group label { font-size: 12px; }
            .form-group input { padding: 7px 10px; font-size: 13px; border-radius: 8px; }
            .form-group .link-row input.link-label { flex-basis: 68px; }
            .form-group .link-row input.link-pwd { flex-basis: 72px; }
            .modal-actions { margin-top: 16px; }
            .modal-actions button { padding: 7px 16px; font-size: 13px; border-radius: 8px; }

            .login-box { padding: 28px 24px 24px; max-width: 300px; }
            .login-box h2 { font-size: 18px; }
            .login-box input { padding: 8px 12px; font-size: 14px; }
            .login-box button { padding: 8px 0; font-size: 14px; }
        }    </style>
</head>
<body>
<!-- 登录层 -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h2>管理后台</h2>
        <p>请输入密码以继续</p>
        <div class="error" id="loginError"></div>
        <input type="password" id="passwordInput" placeholder="输入密码" autocomplete="off">
        <button onclick="checkPassword()">进入后台</button>
    </div>
</div>


<!-- 侧边栏 -->
<aside class="sidebar">
    <button class="nav-item active" data-panel="themePanel">主题管理</button>
    <button class="nav-item" data-panel="iconPanel">图标包管理</button>
    <button class="nav-item" data-panel="watchPanel">手表管理</button>
    <a class="back-link" href="index.html">返回前台</a>
</aside>

    <!-- 手机端悬浮底栏 -->
    <div class="mobile-nav" id="mobileNav">
        <div class="nav-slider" id="navSlider"></div>
        <button class="nav-item active" data-panel="themePanel">主题</button>
        <button class="nav-item" data-panel="iconPanel">图标包</button>
        <button class="nav-item" data-panel="watchPanel">手表</button>
    </div>

<!-- 主内容 -->
<main class="main-content">
    <div class="topbar">
        <h1 id="panelTitle">主题管理</h1>
        <button class="save-btn" onclick="saveDataToFile()" style="padding:8px 20px;border:none;border-radius:10px;background:#1a1a2e;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;">提交到 GitHub</button>
    </div>

    <!-- 主题面板 -->
    <div class="panel active" id="themePanel">
        <div class="panel-header">
            <h3>主题列表</h3>
            <div class="header-actions">
                <a class="back-site-btn" href="index.html">返回主站</a>
                <button class="add-btn" onclick="openAddModal('theme')">添加主题</button>
            </div>
        </div>
        <div class="item-grid" id="themeGrid"></div>
    </div>

    <!-- 图标包面板 -->
    <div class="panel" id="iconPanel">
        <div class="panel-header">
            <h3>图标包列表</h3>
            <div class="header-actions">
                <a class="back-site-btn" href="index.html">返回主站</a>
                <button class="add-btn" onclick="openAddModal('icon')">添加图标包</button>
            </div>
        </div>
        <div class="item-grid" id="iconGrid"></div>
    </div>

    <!-- 手表面板 -->
    <div class="panel" id="watchPanel">
        <div class="panel-header">
            <h3>手表列表</h3>
            <div class="header-actions">
                <a class="back-site-btn" href="index.html">返回主站</a>
                <button class="add-btn" onclick="openAddModal('watch')">添加手表</button>
            </div>
        </div>
        <div class="item-grid" id="watchGrid"></div>
    </div>

</main>

<!-- 提示 -->
<div class="toast" id="toast"></div>

<!-- Token 设置弹窗 -->
<div class="modal" id="tokenModal">
    <div class="modal-box">
        <h3>GitHub Token 设置</h3>
        <div class="form-group">
            <label>GitHub Personal Access Token</label>
            <input id="tokenInput" type="password" placeholder="输入你的 GitHub Token">
            <div class="helper">Token 仅保存在你浏览器本地，不会上传</div>
        </div>
        <div class="form-group">
            <label>分支名</label>
            <input id="branchInput" placeholder="main 或 master">
            <div class="helper">你的 GitHub Pages 使用的分支</div>
        </div>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeTokenModal()">取消</button>
            <button class="confirm-btn" onclick="verifyToken()" style="background:#667eea;">验证 Token</button>
            <button class="confirm-btn" onclick="saveToken()">保存</button>
        </div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal" id="editModal">
    <div class="modal-box">
        <h3 id="modalTitle">编辑</h3>
        <div class="form-group">
            <label>ID（唯一标识，如 recircle）</label>
            <input id="editId" placeholder="英文id，用于链接匹配">
        </div>
        <div class="form-group">
            <label>名称</label>
            <input id="editName" placeholder="显示的名称">
        </div>
        <div class="form-group">
            <label>缩略图</label>
            <div class="thumb-row">
                <div class="thumb-preview" id="thumbPreview">未选择</div>
                <div class="thumb-side">
                    <button type="button" class="upload-btn" id="uploadBtn" onclick="document.getElementById('thumbFile').click()">上传图片</button>
                    <input type="file" id="thumbFile" accept="image/*" hidden>
                    <div class="helper" id="thumbHint">选择文件自动上传到 GitHub 对应目录；也可直接填写下方路径</div>
                </div>
            </div>
            <input id="editImg" placeholder="上传后自动填入，也可手动填写路径，如 theme_preview/recircle.webp" style="margin-top:8px">
        </div>
        <div id="brandFields">
            <div class="form-group"><label>小米链接</label><input id="editXiaomi" placeholder="可选"></div>
            <div class="form-group"><label>OPPO 链接</label><input id="editOppo" placeholder="可选"></div>
            <div class="form-group"><label>vivo 链接</label><input id="editVivo" placeholder="可选"></div>
        </div>
        <div class="form-group" id="linksGroup" style="display:none">
            <label>链接（名称和地址都可以自定义）</label>
            <div id="linkRows"></div>
            <button type="button" class="add-link-btn" onclick="addLinkRow()">+ 添加链接</button>
            <div class="helper">例如「爱发电」「小红书」「酷安」；网盘链接把提取码填在第三格</div>
        </div>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeEditModal()">取消</button>
            <button class="confirm-btn" onclick="saveEdit()">保存</button>
        </div>
    </div>
</div>

<script>

    // ===== GitHub 配置 =====
    // 从 localStorage 读取 Token，首次使用需要设置
    var GITHUB_TOKEN = localStorage.getItem('github_token') || '';
    var GITHUB_OWNER = 'Alittlejelly';
    var GITHUB_REPO = 'Alittlejelly.github.io';
    var GITHUB_BRANCH = 'main';  // 你的默认分支名，可能是 main 或 master
    var GITHUB_FILE_PATH = 'data.json';

    var ENCODED_PASSWORD = 'QEh3cTU3NTcxNjk5NTE1MQ==';
  
    function checkPassword() {
        var input = document.getElementById('passwordInput');
        var error = document.getElementById('loginError');
        if (btoa(input.value) === ENCODED_PASSWORD) {
            document.getElementById('loginScreen').classList.add('hidden');
            input.value = '';
        } else {
            error.textContent = '密码错误，请重试';
            input.value = '';
            setTimeout(function() { error.textContent = ''; }, 2000);
        }
    }
  
    document.getElementById('passwordInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') checkPassword();
    });
  
    // ===== 从 data.json 加载数据 =====
    var data = { theme: [], icon: [], watch: [] };

    function loadData() {
        fetch('data.json?_=' + Date.now())
            .then(function(res) { return res.json(); })
            .then(function(json) {
                data = json;
                renderAll();
                setTimeout(function() { updateMobileSlider(); }, 100);
            })
            .catch(function(err) {
                console.error('加载 data.json 失败', err);
                showToast('数据加载失败，请检查 data.json 是否存在');
            });
    }

    // ===== 通过 GitHub API 获取 data.json 的 SHA（用于更新） =====
    function getFileSha() {
        var url = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_FILE_PATH + '?ref=' + GITHUB_BRANCH;
        return fetch(url, {
            headers: { 'Authorization': 'token ' + GITHUB_TOKEN }
        })
        .then(function(res) { return res.json(); })
        .then(function(json) {
            if (json.sha) return json.sha;
            throw new Error('获取 SHA 失败: ' + JSON.stringify(json));
        });
    }

    // ===== 缩略图上传：选文件 → 传到对应预览目录 → 把路径读回表单 =====
    var UPLOAD_DIRS = { theme: 'theme_preview', icon: 'iconpack_preview', watch: 'watch_preview' };
    var UPLOAD_EXTS = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'avif'];
    var MAX_UPLOAD_BYTES = 5 * 1024 * 1024;

    function contentsApiUrl(filePath) {
        return 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + filePath;
    }

    // 取某个文件在当前分支上的 SHA；文件不存在返回 null（表示新建）
    function getContentSha(filePath) {
        return fetch(contentsApiUrl(filePath) + '?ref=' + GITHUB_BRANCH, {
            headers: { 'Authorization': 'token ' + GITHUB_TOKEN }
        })
        .then(function(res) { return res.status === 404 ? null : res.json(); })
        .then(function(json) { return json && json.sha ? json.sha : null; });
    }

    function readFileAsDataUrl(file) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function() { resolve(reader.result); };
            reader.onerror = function() { reject(new Error('本地读取失败')); };
            reader.readAsDataURL(file);
        });
    }

    // 预览：本地用刚选的文件，打开弹窗时用已保存的路径
    function setThumbPreview(src) {
        var box = document.getElementById('thumbPreview');
        if (src) {
            box.style.backgroundImage = 'url("' + String(src).replace(/"/g, '%22') + '")';
            box.textContent = '';
        } else {
            box.style.backgroundImage = '';
            box.textContent = '未选择';
        }
    }

    function uploadThumbnail(file) {
        if (!GITHUB_TOKEN) {
            showToast('请先设置 GitHub Token！双击标题打开设置');
            return;
        }
        if (file.type && file.type.indexOf('image/') !== 0) {
            showToast('请选择图片文件');
            return;
        }
        if (file.size > MAX_UPLOAD_BYTES) {
            showToast('图片超过 5MB，请先压缩再上传');
            return;
        }

        var id = document.getElementById('editId').value.trim().replace(/[^A-Za-z0-9_-]/g, '');
        if (!id) {
            showToast('请先填写 ID（上传后用作图片文件名）');
            return;
        }

        var dir = UPLOAD_DIRS[currentType] || UPLOAD_DIRS.theme;
        var ext = (file.name.split('.').pop() || '').toLowerCase();
        if (UPLOAD_EXTS.indexOf(ext) < 0) ext = 'png';
        var targetPath = dir + '/' + id + '.' + ext;

        var btn = document.getElementById('uploadBtn');
        var hint = document.getElementById('thumbHint');
        btn.disabled = true;
        btn.textContent = '上传中…';
        hint.textContent = '正在上传到 ' + targetPath + ' …';

        readFileAsDataUrl(file)
            .then(function(dataUrl) {
                setThumbPreview(dataUrl);
                return getContentSha(targetPath).then(function(sha) {
                    return fetch(contentsApiUrl(targetPath), {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'token ' + GITHUB_TOKEN,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: '上传缩略图 ' + targetPath,
                            content: dataUrl.split(',')[1],
                            branch: GITHUB_BRANCH,
                            sha: sha || undefined
                        })
                    });
                });
            })
            .then(function(res) {
                return res.json().then(function(json) { return { ok: res.ok, status: res.status, json: json }; });
            })
            .then(function(r) {
                if (!r.ok || !r.json.content) {
                    throw new Error((r.json && r.json.message) || ('HTTP ' + r.status));
                }
                document.getElementById('editImg').value = targetPath;
                hint.textContent = '已上传：' + targetPath + '（Pages 部署后前台才可见）';
                showToast('图片已上传，记得点「提交到 GitHub」保存数据');
            })
            .catch(function(err) {
                hint.textContent = '上传失败：' + err.message;
                setThumbPreview(document.getElementById('editImg').value);
                showToast('上传失败: ' + err.message);
            })
            .finally(function() {
                btn.disabled = false;
                btn.textContent = '上传图片';
                document.getElementById('thumbFile').value = '';
            });
    }

    document.getElementById('thumbFile').addEventListener('change', function() {
        var file = this.files && this.files[0];
        if (file) uploadThumbnail(file);
    });

    // ===== 通过 GitHub API 直接提交 data.json =====
    function saveDataToFile() {
        if (!GITHUB_TOKEN) {
            showToast('请先设置 GitHub Token！双击标题打开设置');
            return;
        }

        var btn = document.querySelector('.save-btn');
        btn.textContent = '正在提交...';
        btn.disabled = true;

        var jsonStr = JSON.stringify(data, null, 2);
        var content = btoa(unescape(encodeURIComponent(jsonStr))); // Base64 编码（支持中文）

        // 先获取当前文件的 SHA
        getFileSha()
            .then(function(sha) {
                // 提交更新
                return fetch('https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_FILE_PATH, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + GITHUB_TOKEN,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '后台更新 data.json - ' + new Date().toLocaleString('zh-CN'),
                        content: content,
                        sha: sha,
                        branch: GITHUB_BRANCH
                    })
                });
            })
            .then(function(res) { return res.json(); })
            .then(function(json) {
                if (json.content) {
                    showToast('已提交到 GitHub！等待 Pages 部署（约1-2分钟）');
                } else {
                    throw new Error(JSON.stringify(json));
                }
            })
            .catch(function(err) {
                console.error('提交失败', err);
                showToast('提交失败: ' + err.message);
            })
            .finally(function() {
                btn.textContent = '提交到 GitHub';
                btn.disabled = false;
            });
    }

    var currentType = 'theme';
    var editingId = null;

    function updateMobileSlider() {
        var nav = document.getElementById('mobileNav');
        if (!nav) return;
        var slider = nav.querySelector('.nav-slider');
        var active = nav.querySelector('.nav-item.active');
        if (!slider || !active) return;
        slider.style.left = active.offsetLeft + 'px';
        slider.style.width = active.offsetWidth + 'px';
    }

    function switchPanel(btn) {
        var target = btn.dataset.panel;
        document.querySelectorAll('.nav-item').forEach(function(item) {
            item.classList.remove('active');
        });
        document.querySelectorAll('.nav-item[data-panel="' + target + '"]').forEach(function(item) {
            item.classList.add('active');
        });
        document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
        document.getElementById(target).classList.add('active');
        var titleMap = { themePanel:'主题管理', iconPanel:'图标包管理', watchPanel:'手表管理' };
        document.getElementById('panelTitle').textContent = titleMap[target];
        currentType = target.replace('Panel', '');
        updateMobileSlider();
    }

    // ===== 自定义链接（图标包 / 手表） =====
    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 读取条目的链接：优先 links 数组，兼容旧数据里的 link / xhs 字段
    function itemLinks(item) {
        var out = [];
        if (item && item.links && item.links.length) {
            for (var i = 0; i < item.links.length; i++) {
                var l = item.links[i];
                if (l && l.url) out.push({ label: l.label || '打开', url: l.url, password: l.password || '' });
            }
            return out;
        }
        if (item && item.link) out.push({ label: '爱发电', url: item.link, password: '' });
        if (item && item.xhs) out.push({ label: '小红书', url: item.xhs, password: '' });
        return out;
    }

    function addLinkRow(label, url, password) {
        var row = document.createElement('div');
        row.className = 'link-row';
        row.innerHTML = '<input class="link-label" placeholder="名称">' +
                        '<input class="link-url" placeholder="https://...">' +
                        '<input class="link-pwd" placeholder="提取码">' +
                        '<button type="button" class="del-link" title="删除这条">&times;</button>';
        row.querySelector('.link-label').value = label || '';
        row.querySelector('.link-url').value = url || '';
        row.querySelector('.link-pwd').value = password || '';
        row.querySelector('.del-link').addEventListener('click', function() {
            var box = document.getElementById('linkRows');
            box.removeChild(row);
            if (!box.children.length) addLinkRow();
        });
        document.getElementById('linkRows').appendChild(row);
    }

    function setLinkRows(list) {
        var box = document.getElementById('linkRows');
        box.innerHTML = '';
        var items = list || [];
        for (var i = 0; i < items.length; i++) addLinkRow(items[i].label, items[i].url, items[i].password);
        if (!items.length) addLinkRow();
    }

    function collectLinks() {
        var rows = document.querySelectorAll('#linkRows .link-row');
        var out = [];
        for (var i = 0; i < rows.length; i++) {
            var label = rows[i].querySelector('.link-label').value.trim();
            var url = rows[i].querySelector('.link-url').value.trim();
            var pwd = rows[i].querySelector('.link-pwd').value.trim();
            if (!url) continue;
            var link = { label: label || '打开', url: url };
            if (pwd) link.password = pwd;
            out.push(link);
        }
        return out;
    }

    // ===== 渲染 =====
    function renderAll() {
        renderGrid('theme', 'themeGrid', false);
        renderGrid('icon', 'iconGrid', true);
        renderGrid('watch', 'watchGrid', true);
    }

    function renderGrid(type, gridId, wide) {
        var grid = document.getElementById(gridId);
        var items = data[type];
        var html = '';
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            var linkTags = '';
            if (type === 'theme') {
                linkTags = '<span class="tag' + (item.xiaomi ? ' has-link' : '') + '">小米</span>' +
                           '<span class="tag' + (item.oppo ? ' has-link' : '') + '">OPPO</span>' +
                           '<span class="tag' + (item.vivo ? ' has-link' : '') + '">vivo</span>';
            } else {
                var links = itemLinks(item);
                if (!links.length) {
                    linkTags = '<span class="tag">暂无链接</span>';
                } else {
                    for (var k = 0; k < links.length; k++) {
                        linkTags += '<span class="tag has-link">' + escapeHtml(links[k].label) + '</span>';
                    }
                }
            }
            html += '<div class="manage-card">' +
                        '<div class="preview' + (wide ? ' wide' : '') + '" style="background-image:url(' + item.img + ')"></div>' +
                        '<div class="info">' +
                            '<div class="name">' + item.name + '</div>' +
                            '<div class="id-text">ID: ' + item.id + '</div>' +
                            '<div class="links">' + linkTags + '</div>' +
                        '</div>' +
                        '<div class="actions">' +
                            '<button onclick="openEditModal(\'' + type + '\',\'' + item.id + '\')">编辑</button>' +
                            '<button class="delete-btn" onclick="deleteItem(\'' + type + '\',\'' + item.id + '\')">删除</button>' +
                        '</div>' +
                    '</div>';
        }
        grid.innerHTML = html;
    }

    // ===== 导航切换 =====
    var navItems = document.querySelectorAll('.nav-item');
    for (var i = 0; i < navItems.length; i++) {
        navItems[i].addEventListener('click', function() {
            switchPanel(this);
            currentType = this.dataset.panel.replace('Panel', '');
        });
    }

    // ===== 编辑弹窗 =====
    function openEditModal(type, id) {
        currentType = type;
        editingId = id;
        var items = data[type];
        var item = null;
        for (var i = 0; i < items.length; i++) {
            if (items[i].id === id) { item = items[i]; break; }
        }
        if (!item) return;

        document.getElementById('modalTitle').textContent = '编辑 - ' + item.name;
        document.getElementById('editId').value = item.id;
        document.getElementById('editName').value = item.name;
        document.getElementById('editImg').value = item.img;
        setThumbPreview(item.img);
        document.getElementById('thumbHint').textContent = '选择新图片可替换，路径会自动更新';

        if (type === 'theme') {
            document.getElementById('brandFields').style.display = 'block';
            document.getElementById('linksGroup').style.display = 'none';
            document.getElementById('editXiaomi').value = item.xiaomi || '';
            document.getElementById('editOppo').value = item.oppo || '';
            document.getElementById('editVivo').value = item.vivo || '';
        } else {
            document.getElementById('brandFields').style.display = 'none';
            document.getElementById('linksGroup').style.display = 'block';
            setLinkRows(itemLinks(item));
        }

        document.getElementById('editModal').classList.add('show');
    }

    function openAddModal(type) {
        currentType = type;
        editingId = null;
        document.getElementById('modalTitle').textContent = '添加新' + (type === 'theme' ? '主题' : type === 'icon' ? '图标包' : '手表');
        document.getElementById('editId').value = '';
        document.getElementById('editName').value = '';
        document.getElementById('editImg').value = '';
        setThumbPreview('');
        document.getElementById('thumbHint').textContent = '选择后自动上传到 GitHub 对应目录，并填入路径';
        document.getElementById('editXiaomi').value = '';
        document.getElementById('editOppo').value = '';
        document.getElementById('editVivo').value = '';
        setLinkRows([]);

        if (type === 'theme') {
            document.getElementById('brandFields').style.display = 'block';
            document.getElementById('linksGroup').style.display = 'none';
        } else {
            document.getElementById('brandFields').style.display = 'none';
            document.getElementById('linksGroup').style.display = 'block';
        }

        document.getElementById('editModal').classList.add('show');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('show');
    }

    function saveEdit() {
        var type = currentType;
        var id = document.getElementById('editId').value.trim();
        var name = document.getElementById('editName').value.trim();
        var img = document.getElementById('editImg').value.trim();

        if (!id || !name) {
            showToast('请填写完整信息');
            return;
        }
        if (!img) {
            showToast('请上传缩略图或填写图片路径');
            return;
        }

        var items = data[type];
        if (type === 'theme') {
            var xiaomi = document.getElementById('editXiaomi').value.trim();
            var oppo = document.getElementById('editOppo').value.trim();
            var vivo = document.getElementById('editVivo').value.trim();

            if (editingId) {
                for (var i = 0; i < items.length; i++) {
                    if (items[i].id === editingId) {
                        items[i].id = id;
                        items[i].name = name;
                        items[i].img = img;
                        items[i].xiaomi = xiaomi;
                        items[i].oppo = oppo;
                        items[i].vivo = vivo;
                        break;
                    }
                }
            } else {
                items.push({ id:id, name:name, img:img, xiaomi:xiaomi, oppo:oppo, vivo:vivo });
            }
        } else {
            var links = collectLinks();
            if (editingId) {
                for (var i = 0; i < items.length; i++) {
                    if (items[i].id === editingId) {
                        items[i].id = id;
                        items[i].name = name;
                        items[i].img = img;
                        items[i].links = links;
                        delete items[i].link;
                        delete items[i].xhs;
                        break;
                    }
                }
            } else {
                items.push({ id:id, name:name, img:img, links:links });
            }
        }

        closeEditModal();
        renderAll();
        showToast('提交成功！点击「提交到 GitHub」按钮提交更新');
    }

    // ===== 删除 =====
    function deleteItem(type, id) {
        if (!confirm('确定删除 ' + id + ' 吗？')) return;
        var items = data[type];
        for (var i = 0; i < items.length; i++) {
            if (items[i].id === id) { items.splice(i, 1); break; }
        }
        renderAll();
        showToast('已删除');
    }

    

    // ===== Token 设置弹窗 =====
    function openTokenModal() {
        document.getElementById('tokenInput').value = localStorage.getItem('github_token') || '';
        document.getElementById('branchInput').value = localStorage.getItem('github_branch') || 'main';
        document.getElementById('tokenModal').classList.add('show');
    }

    // 验证 Token 是否有效
    function verifyToken() {
        var token = document.getElementById('tokenInput').value.trim();
        if (!token) { showToast('请输入 Token'); return; }
        
        var btn = document.querySelector('#tokenModal .confirm-btn');
        btn.textContent = '验证中...';
        btn.disabled = true;

        fetch('https://api.github.com/user', {
            headers: { 'Authorization': 'token ' + token }
        })
        .then(function(res) {
            if (res.ok) return res.json();
            if (res.status === 401) throw new Error('Token 无效');
            if (res.status === 403) throw new Error('Token 权限不足');
            throw new Error('HTTP ' + res.status);
        })
        .then(function(user) {
            showToast('Token 有效，用户: ' + user.login);
            // 自动填入分支
            return fetch('https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO, {
                headers: { 'Authorization': 'token ' + token }
            });
        })
        .then(function(res) { return res.json(); })
        .then(function(repo) {
            if (repo.default_branch) {
                document.getElementById('branchInput').value = repo.default_branch;
            }
        })
        .catch(function(err) {
            showToast('Token 验证失败: ' + err.message);
        })
        .finally(function() {
            btn.textContent = '验证 Token';
            btn.disabled = false;
        });
    }

    function closeTokenModal() {
        document.getElementById('tokenModal').classList.remove('show');
    }

    function saveToken() {
        var token = document.getElementById('tokenInput').value.trim();
        var branch = document.getElementById('branchInput').value.trim() || 'main';
        if (!token) {
            showToast('请输入 Token');
            return;
        }
        localStorage.setItem('github_token', token);
        localStorage.setItem('github_branch', branch);
        GITHUB_TOKEN = token;
        GITHUB_BRANCH = branch;
        closeTokenModal();
        showToast('Token 已保存到本地浏览器');
    }

    // 双击标题打开 Token 设置
    document.getElementById('panelTitle').addEventListener('dblclick', function() {
        openTokenModal();
    });

    // 弹窗点击外部关闭
    document.getElementById('tokenModal').addEventListener('click', function(e) {
        if (e.target === this) closeTokenModal();
    });

    // ===== Toast =====
    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show'); }, 3000);
    }

    // ===== 弹窗点击外部关闭 =====
    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeEditModal();
    });

    // ===== 初始化 =====
    loadData();
</script>
