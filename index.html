<script>
    // ===== 从 data.json 加载数据 =====
    var siteData = { theme: [], icon: [], watch: [] };

    function loadData() {
        fetch('data.json?_=' + Date.now())
            .then(function(res) { return res.json(); })
            .then(function(data) {
                siteData = data;
                renderCards('themeGrid', data.theme, false);
                renderCards('iconGrid',  data.icon,  true);
                renderCards('watchGrid', data.watch, true);
                updateNavCounts(data);
                bindCardClicks(data);
            })
            .catch(function(err) {
                console.error('数据加载失败', err);
                showLoadError();
            });
    }

    // 数据加载失败时的提示（不再维护内嵌兜底数据）
    function showLoadError() {
        var notice = '<div class="load-error">数据加载失败，请刷新页面重试</div>';
        var grids = ['themeGrid', 'iconGrid', 'watchGrid'];
        for (var i = 0; i < grids.length; i++) {
            document.getElementById(grids[i]).innerHTML = notice;
        }
        var counts = document.querySelectorAll('.sidebar-nav .nav-item .nav-count');
        for (var j = 0; j < counts.length; j++) counts[j].textContent = '-';
    }

    function updateNavCounts(data) {
        var navItems = document.querySelectorAll('.sidebar-nav .nav-item');
        var counts = [data.theme.length, data.icon.length, data.watch.length];
        for (var i = 0; i < navItems.length; i++) {
            var countEl = navItems[i].querySelector('.nav-count');
            if (countEl && counts[i] !== undefined) {
                countEl.textContent = counts[i];
            }
        }
    }

    // ===== 渲染卡片 =====
    function renderCards(containerId, items, wide) {
        var grid = document.getElementById(containerId);
        var html = '';
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            html += '<div class="project-card" data-id="' + item.id + '">' +
                      '<div class="project-cover' + (wide ? ' cover-wide' : '') + '" style="background-image:url(' + item.img + ')"></div>' +
                      '<div class="project-info">' +
                        '<span class="project-name">' + item.name + '</span>' +
                        '<span class="project-arrow">→</span>' +
                      '</div>' +
                    '</div>';
        }
        grid.innerHTML = html;
    }

    // ===== 绑定卡片点击事件 =====
    function bindCardClicks(data) {
        // 主题卡片点击
        var themeCards = document.querySelectorAll('#themeGrid .project-card');
        for (var i = 0; i < themeCards.length; i++) {
            (function(card) {
                card.addEventListener('click', function() {
                    var id = this.dataset.id;
                    var name = this.querySelector('.project-name').textContent;
                    modalTitle.textContent = name + '主题';
                    modal.dataset.currentTheme = id;
                    showModal();
                });
            })(themeCards[i]);
        }

        // 图标包卡片点击
        var iconCards = document.querySelectorAll('#iconGrid .project-card');
        for (var i = 0; i < iconCards.length; i++) {
            (function(card) {
                card.addEventListener('click', function() {
                    var id = this.dataset.id;
                    var name = this.querySelector('.project-name').textContent;
                    openLinkModalFor(findItem(data.icon, id), name);
                });
            })(iconCards[i]);
        }

        // 表盘卡片点击
        var watchCards = document.querySelectorAll('#watchGrid .project-card');
        for (var i = 0; i < watchCards.length; i++) {
            (function(card) {
                card.addEventListener('click', function() {
                    var id = this.dataset.id;
                    var name = this.querySelector('.project-name').textContent;
                    openLinkModalFor(findItem(data.watch, id), name);
                });
            })(watchCards[i]);
        }
    }

    function findItem(arr, id) {
        for (var i = 0; i < arr.length; i++) {
            if (arr[i].id === id) return arr[i];
        }
        return null;
    }

    // 读取条目的链接：优先 links 数组，兼容旧数据里的 link / xhs 字段
    function getItemLinks(item) {
        var out = [];
        if (item && item.links && item.links.length) {
            for (var i = 0; i < item.links.length; i++) {
                var l = item.links[i];
                if (l && l.url) out.push({ label: l.label || '打开', url: l.url, password: l.password || '' });
            }
            return out;
        }
        if (item && item.link) out.push({ label: '爱发电', url: item.link, password: '' });
        if (item && item.xhs) out.push({ label: '小红书', url: item.xhs, password: '' });
        return out;
    }

    // 按条目自己的链接动态生成弹窗按钮（图标包 / 手表），网盘链接额外显示提取码
    function openLinkModalFor(item, name) {
        var links = getItemLinks(item);
        if (!links.length) {
            alert('暂未上架，敬请期待！');
            return;
        }
        var box = document.getElementById('linkModalActions');
        box.innerHTML = '';
        for (var i = 0; i < links.length; i++) {
            (function(link) {
                var wrap = document.createElement('div');
                wrap.className = 'link-item';

                var btn = document.createElement('button');
                btn.className = 'modal-btn';
                btn.textContent = link.label;
                btn.addEventListener('click', function() {
                    window.open(link.url, '_blank');
                    hideLinkModal();
                });
                wrap.appendChild(btn);

                if (link.password) {
                    var pwd = document.createElement('div');
                    pwd.className = 'link-pwd';
                    pwd.appendChild(document.createTextNode('提取码 '));
                    var code = document.createElement('b');
                    code.textContent = link.password;
                    pwd.appendChild(code);

                    var copy = document.createElement('button');
                    copy.type = 'button';
                    copy.className = 'copy-pwd';
                    copy.textContent = '复制';
                    copy.addEventListener('click', function() { copyText(link.password, copy); });
                    pwd.appendChild(copy);
                    wrap.appendChild(pwd);
                }

                box.appendChild(wrap);
            })(links[i]);
        }
        linkModalTitle.textContent = name;
        showLinkModal();
    }

    // 复制文本，并在按钮上给出「已复制」反馈
    function copyText(text, btn) {
        var done = function() {
            if (!btn) return;
            btn.textContent = '已复制';
            btn.classList.add('copied');
            setTimeout(function() { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
        };
        var fail = function() { fallbackCopy(text); done(); };
        if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fail);
            return;
        }
        fail();
    }

    // 旧浏览器兜底（非 HTTPS 或剪贴板 API 被拒时）
    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', 'readonly');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
    }

        // ===== 更新滑块位置 =====
    function updateSlider(nav) {
        var slider = nav.querySelector('.nav-slider');
        if (!slider) return;
        var active = nav.querySelector('.nav-item.active');
        if (!active) return;
        slider.style.left = active.offsetLeft + 'px';
        slider.style.width = active.offsetWidth + 'px';
    }

    // ===== 左侧导航切换 =====
    var navItems = document.querySelectorAll('.sidebar-nav .nav-item');
    for (var i = 0; i < navItems.length; i++) {
        navItems[i].addEventListener('click', function() {
            for (var j = 0; j < navItems.length; j++) {
                navItems[j].classList.remove('active');
            }
            this.classList.add('active');

            var target = this.getAttribute('data-target');
            var panels = document.querySelectorAll('.content-panel');
            for (var j = 0; j < panels.length; j++) {
                panels[j].classList.remove('active');
            }
            document.getElementById(target).classList.add('active');

            // 更新标题
            var titleMap = { themePanel:'主题', iconPanel:'图标包', watchPanel:'手表' };
            document.getElementById('panelTitle').textContent = titleMap[target] || '暂无';

            // 更新滑块
            var mobileNav = document.getElementById('mobileNav');
            if (mobileNav) updateSlider(mobileNav);
        });
    }

    // 初始滑块位置
    var mobileNav = document.getElementById('mobileNav');
    if (mobileNav) setTimeout(function() { updateSlider(mobileNav); }, 50);

    // ===== 顶部 Tab 切换 (左侧导航已经切换面板，Tab在各面板中独立工作) =====
    var tabBtns = document.querySelectorAll('.tab-bar .tab-btn');
    var allGrids = { themeGrid: 'themePanel', iconGrid: 'iconPanel', watchGrid: 'watchPanel' };

    for (var i = 0; i < tabBtns.length; i++) {
        tabBtns[i].addEventListener('click', function() {
            for (var j = 0; j < tabBtns.length; j++) {
                tabBtns[j].classList.remove('active');
            }
            this.classList.add('active');

            var target = this.getAttribute('data-target');
            var activePanel = document.querySelector('.content-panel.active');
            if (!activePanel) return;
            var panelId = activePanel.id;

            // 隐藏当前面板中所有 grid
            var gridsInPanel = activePanel.querySelectorAll('.project-grid');
            for (var k = 0; k < gridsInPanel.length; k++) {
                gridsInPanel[k].style.display = 'none';
            }

            // 如果 target 属于当前面板，显示它
            if (allGrids[target] === panelId) {
                document.getElementById(target).style.display = 'grid';
            } else {
                var firstGrid = activePanel.querySelector('.project-grid');
                if (firstGrid) firstGrid.style.display = 'grid';
            }
        });
    }

    // ===== 弹窗 =====
    var modal = document.getElementById('themeModal');
    var closeBtn = modal.querySelector('.modal-close');
    var modalTitle = modal.querySelector('.modal-title');

    function showModal() { modal.classList.add('show'); }
    function hideModal() { modal.classList.remove('show'); }

    closeBtn.onclick = hideModal;
    window.onclick = function(e) { if (e.target === modal) hideModal(); };

    // 弹窗按钮 - 从 siteData 读取品牌链接
    var modalBtns = modal.querySelectorAll('.modal-btn');
    for (var i = 0; i < modalBtns.length; i++) {
        modalBtns[i].addEventListener('click', function() {
            var brand = this.dataset.brand;
            var currentTheme = modal.dataset.currentTheme;
            var themeItem = findItem(siteData.theme, currentTheme);
            var url = themeItem && themeItem[brand];
            if (url) {
                window.open(url, '_blank');
            } else {
                alert('暂未上架，敬请期待！');
            }
            hideModal();
        });
    }

    // ===== 链接弹窗 (图标包/手表) =====
    var linkModal = document.getElementById('linkModal');
    var linkCloseBtn = linkModal.querySelector('.modal-close');
    var linkModalTitle = linkModal.querySelector('.modal-title');

    function showLinkModal() { linkModal.classList.add('show'); }
    function hideLinkModal() { linkModal.classList.remove('show'); }

    linkCloseBtn.onclick = hideLinkModal;
    linkModal.addEventListener('click', function(e) { if (e.target === linkModal) hideLinkModal(); });

    // 链接弹窗的按钮已在 openLinkModalFor() 里按条目数据动态生成，这里不再需要固定绑定

    // 头像切换
    var avatar = document.getElementById('avatarImg');
    var avatarImages = [
        'https://cdn.lightxi.com/cloudreve/uploads/2025/12/25/w2XJIxKb_happy_jelly.png',
        'https://cdn.lightxi.com/cloudreve/uploads/2025/12/25/VDQyfLBP_unhappy_jelly.png',
        'https://cdn.lightxi.com/cloudreve/uploads/2025/12/25/ArYswWtq_cute_jelly.png'
    ];
    var currentIdx = 0;
    avatar.addEventListener('click', function() {
        currentIdx = (currentIdx + 1) % avatarImages.length;
        avatar.src = avatarImages[currentIdx];
        avatar.style.transform = 'scale(0.92)';
        setTimeout(function() { avatar.style.transform = 'scale(1)'; }, 200);
    });

    // 双击标题进入后台
    var mainTitle = document.getElementById('mainTitle');
    if (mainTitle) {
        mainTitle.addEventListener('dblclick', function() {
            window.location.href = 'admin.html';
        });
    }

    // ===== 初始化加载数据 =====
    loadData();
</script>

</body>
